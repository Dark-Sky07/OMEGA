name: TMP go-test report

# TEMPORARY DEBUG WORKFLOW — must be deleted before tagging the release.
# CI logs are unreachable from the debugging sandbox (blocked host), so this
# reports `go test` output to PR #22 as a comment instead.

on:
  push:
    branches:
      - arena/01a0b3b8-omega

permissions:
  contents: read
  pull-requests: write

jobs:
  gotest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Run focused openvpn tests (verbose)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo '```'
            go test ./internal/web/service/ ./internal/sub/ -run 'Openvpn|OpenVPN' -v -count=1 2>&1
            echo "focused exit=$?"
            echo '```'
          } > focused.md
          gh pr comment 22 --body-file focused.md || true
          exit 0
      - name: Run full suite (fail lines only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          go test ./... > full.txt 2>&1
          code=$?
          {
            echo "full suite exit=$code"
            echo '```'
            grep -E -- '^(--- FAIL|FAIL|panic)' full.txt | head -40
            echo '```'
          } > full.md
          gh pr comment 22 --body-file full.md || true
          exit 0
