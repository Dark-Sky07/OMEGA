name: CI

on:
  # Allow running the suite against the default branch on demand (e.g. after a
  # CI-config-only change, which the path filters below would not trigger).
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".nvmrc"

permissions:
  contents: read
  actions: write # TEMP (diagnostics): lets the go-test job upload its output on failure

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Test
        run: |
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          go test $(cat /tmp/go-packages.txt) > /tmp/go-test-output.txt 2>&1
          status=$?
          tail -n 80 /tmp/go-test-output.txt
          exit $status
      - name: Upload test output (TEMP diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-output
          path: /tmp/go-test-output.txt
          if-no-files-found: ignore

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      - name: Fail if generated files are stale (run 'npm run gen' and commit)
        run: git diff --exit-code -- frontend/src/generated frontend/public/openapi.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # OMEGA is pinned to the exact 3x-ui v3.3.1 dependency set on purpose, so
      # advisories disclosed after that release are expected to appear here.
      # Keep the report, don't fail the pipeline on it (see README, "Security").
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      # Same reasoning as govulncheck: the lockfile is the pinned v3.3.1 one.
      - name: Audit
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend
