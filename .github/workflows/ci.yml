name: CI

on:
  # Allow running the suite against the default branch on demand (e.g. after a
  # CI-config-only change, which the path filters below would not trigger).
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "scripts/**"
      - "update.sh"
      - "install.sh"
      - "install-omega.sh"
      - ".nvmrc"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "scripts/**"
      - "update.sh"
      - "install.sh"
      - "install-omega.sh"
      - ".nvmrc"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  update-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify transactional update rollback guards
        run: bash scripts/update-transaction-test.sh

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Verify Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          if go test $(cat /tmp/go-packages.txt) 2>&1 | tee /tmp/go-test.log; then
            exit 0
          fi
          python3 - <<'PYLOG'
          from pathlib import Path
          output = Path('/tmp/go-test.log').read_text(errors='replace')[-60000:]
          output = output.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::error title=go-test-output::{output}')
          PYLOG
          exit 1
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      # Temporary diagnostic output while generated outputs are being
      # reconciled locally; remove after the first green regeneration run.
      - name: Upload regenerated API files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-api-${{ github.sha }}
          path: |
            frontend/src/generated
            frontend/public/openapi.json
      - name: Emit generated files in chunked annotations
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files = [
              Path('frontend/src/generated/examples.ts'),
              Path('frontend/src/generated/schemas.ts'),
              Path('frontend/src/generated/types.ts'),
              Path('frontend/src/generated/zod.ts'),
              Path('frontend/public/openapi.json'),
          ]
          for path in files:
              encoded = base64.b64encode(path.read_bytes()).decode()
              for index in range(0, len(encoded), 3000):
                  chunk = encoded[index:index + 3000]
                  part = index // 3000
                  print(f'::error file={path},line={part + 1},title=generated-{part}::{chunk}')
          PY
      - name: Fail if generated files are stale (run 'npm run gen' and commit')
        run: git diff --exit-code -- frontend/src/generated frontend/public/openapi.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # OMEGA is pinned to the exact 3x-ui v3.3.1 dependency set on purpose, so
      # advisories disclosed after that release are expected to appear here.
      # Keep the report, don't fail the pipeline on it (see README, "Security").
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      # Same reasoning as govulncheck: the lockfile is the pinned v3.3.1 one.
      - name: Audit
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend
