# OMEGA pins the exact dependency set of 3x-ui v3.3.1 (go.mod and
# frontend/package-lock.json are intentionally untouched), so automated
# *version* updates are disabled: open-pull-requests-limit 0 keeps the file
# (and the security-alert integration) in place without opening bump PRs that
# would move the panel off its pinned base.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
